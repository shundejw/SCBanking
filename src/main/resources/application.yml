spring:
  profiles:
    active: dev
  ai:
    openai:
      # DeepSeek (OpenAI-compatible). Key injected via env (SPRING_AI_API_KEY), never hardcoded in yml.
      api-key: "${SPRING_AI_API_KEY:}"
      base-url: "https://api.deepseek.com"
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.0

lcchecker:
  # Ingestion guardrails
  upload:
    max-file-size-mb: 20
    max-pages-allowed: 10
    allowed-magic-bytes: "25504446"   # %PDF
    max-lc-text-length-chars: 50000

  # Dual-stage PDF text + OCR extraction
  ocr:
    confidence-threshold: 0.80
    min-text-length-threshold: 100
    sidecar-url: "http://localhost:8000/api/v1/ocr"
    timeout: 30s
    paddle:
      url: "http://localhost:8866/predict/ocr_system"

  # Spring AI structured-extraction settings (single source of truth; bridged into spring.ai.openai.*)
  llm:
    provider: "spring-ai"
    model-name: "deepseek-v4-flash"
    base-url: "https://api.deepseek.com"
    api-key: "${SPRING_AI_API_KEY:}"
    temperature: 0.0
    timeout: 30s
    prompt-template-path: "classpath:prompts/invoice-extraction-v1.st"

  # Rule-engine execution order. Eleven invoice checks are enabled; the deterministic
  # goods-description fallback remains disabled because the LLM check is the default.
  rules:
    enabled:
      - "amount_rule"
      - "currency_rule"
      - "issuer_rule"
      - "signature_rule"
      - "applicant_rule"
      - "address_country_rule"
      # - "goods_description_rule"      # token Jaccard fallback (disabled; LLM check is default)
      - "llm_goods_description_rule"
      - "quantity_rule"
      - "port_of_loading_rule"
      - "port_of_discharge_rule"
      - "lc_reference_rule"

  # Intermediate-artifact store. Goal doc references /mnt/local/SCB/docs/artifacts/{runId}/;
  # defaulting to a relative docs/artifacts keeps the same {project}/docs/artifacts layout locally.
  artifact:
    root-dir: "docs/artifacts"
